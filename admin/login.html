<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Glamour Cosmetics</title>
<link rel="stylesheet" href="../css/admin.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-login-page">
<div class="login-container">
  <div class="login-box">
    <div class="login-logo">Glamour</div>
    <h2>Admin Login</h2>
    <p>Enter your password to access the dashboard</p>
    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter admin password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
    </form>
    <p class="login-hint">Default password: <code>admin123</code></p>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "admin123";
function handleLogin(e) {
  e.preventDefault();
  const pw = document.getElementById("login-password").value;
  if (pw === ADMIN_PASSWORD) {
    sessionStorage.setItem("glamour_admin", "true");
    window.location.href = "index.html";
  } else {
    document.getElementById("login-error").textContent = "Invalid password. Try again.";
    document.getElementById("login-error").style.display = "block";
  }
}
</script>
</body>
</html>
