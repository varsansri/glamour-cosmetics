<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login — GS-Cosmatics</title>
<link rel="stylesheet" href="../css/admin.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* override admin.css vars if style.css isn't loaded */
  :root{--salmon-pink:hsl(35,53%,51%);--salmon-pink-dark:hsl(35,53%,42%);--salmon-pink-light:hsl(35,53%,90%)}
</style>
</head>
<body class="admin-login-page">
<div class="login-container">
  <div class="login-box">
    <div class="login-logo">GS-Cosmatics<span>.</span></div>
    <div class="login-sublogo">Admin Panel</div>
    <h2>Welcome Back</h2>
    <p>Enter your password to manage your store</p>
    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter admin password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
    </form>
    <p class="login-hint">Default password: <code>admin123</code></p>
    <p class="login-error" id="login-error"></p>
  </div>
  <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--gray-500)">
    <a href="../index.html" style="color:var(--primary);font-weight:500">← Back to Store</a>
  </p>
</div>

<script>
const ADMIN_PASSWORD = "admin123";
function handleLogin(e) {
  e.preventDefault();
  const pw = document.getElementById("login-password").value;
  if (pw === ADMIN_PASSWORD) {
    sessionStorage.setItem("glamour_admin", "true");
    window.location.href = "index.html";
  } else {
    document.getElementById("login-error").textContent = "Invalid password. Try again.";
    document.getElementById("login-error").style.display = "block";
    document.getElementById("login-password").value = "";
    document.getElementById("login-password").focus();
  }
}
</script>
</body></html>
