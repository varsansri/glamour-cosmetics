<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wishlist — GScosmatics</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>✨</text></svg>"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script><script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script></head><body>
<header class="header"><div class="header-top">Free shipping above ₹999 ✨</div><div class="header-main"><div class="container"><button class="hamburger" onclick="toggleMobileNav()"><ion-icon name="menu-outline"></ion-icon></button><a href="index.html" class="header-logo">GScosmatics<span>.</span></a><div class="header-user-actions"><a href="cart.html" class="action-btn"><ion-icon name="bag-handle-outline"></ion-icon><span class="count" id="cart-count">0</span></a></div></div></div></header>
<div class="mobile-bottom-navigation"><button class="action-btn" onclick="toggleMobileNav()"><ion-icon name="menu-outline"></ion-icon></button><a href="cart.html" class="action-btn"><ion-icon name="bag-handle-outline"></ion-icon><span class="count" id="cart-count-mobile">0</span></a><a href="index.html" class="action-btn"><ion-icon name="home-outline"></ion-icon></a><a href="products.html" class="action-btn"><ion-icon name="grid-outline"></ion-icon></a></div>
<div class="product-featured" style="margin-top:30px"><div class="container" style="max-width:800px"><h2 class="title">Your Wishlist<a href="products.html" class="view-all">Browse Products →</a></h2><div class="product-grid" id="wishlist-grid"></div></div></div>
<footer><div class="container"><div class="footer-bottom"><p class="copyright">&copy; 2026 GScosmatics. Your skin is gold. ✨</p></div></div></footer>
<div class="toast" id="toast"></div>
<script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/theme.js"></script><script src="js/app.js"></script>
<script>function toggleMobileNav(){document.getElementById('mobile-nav')?document.getElementById('mobile-nav').classList.toggle('active'):null}
(function(){var g=document.getElementById('wishlist-grid');var w=getWishlist();if(w.length===0){g.innerHTML='<div style="text-align:center;padding:60px 0;grid-column:1/-1"><p style="font-size:60px;margin-bottom:12px">♡</p><h3 style="color:var(--eerie-black);margin-bottom:8px">No saved items</h3><p style="color:var(--sonic-silver);margin-bottom:20px;font-size:var(--fs-7)">Tap the heart icon on any product to save it here.</p><a href="products.html" class="add-cart-btn" style="display:inline-block;width:auto;padding:10px 24px">Start Browsing</a></div>';return}var p=loadProducts();g.innerHTML=w.map(function(id){var x=p.find(function(y){return y.id===id});if(!x)return'';return '<div class="showcase" onclick="location.href=\'product.html?id='+x.id+'\'" style="position:relative"><div class="showcase-banner"><img src="'+x.image+'" alt="'+x.name+'" loading="lazy"><button class="btn-action" style="position:absolute;top:10px;right:10px;z-index:3" onclick="event.stopPropagation();toggleWishlist(\''+x.id+'\');location.reload()"><ion-icon name="heart"></ion-icon></button></div><div class="showcase-content"><span class="showcase-category">'+x.category+'</span><h3 class="showcase-title">'+x.name+'</h3><div class="showcase-rating">'+renderStars(x.rating)+'<span>('+x.reviews+')</span></div><div class="price-box"><p class="price">'+formatINR(x.price)+'</p></div><button class="add-cart-btn" onclick="event.stopPropagation();addToCart(\''+x.id+'\')">Add to Cart</button></div></div>'}).join('')})();</script>
</body></html>
