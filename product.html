<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - Glamour Cosmetics</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
  <div class="header-top">
    <p>Free shipping on orders over $50 ✨</p>
  </div>
  <div class="header-main">
    <div class="container">
      <a href="index.html" class="logo">Glamour</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="products.html?cat=skincare">Skincare</a>
        <a href="products.html?cat=makeup">Makeup</a>
        <a href="index.html#about">About</a>
      </nav>
      <div class="header-icons">
        <a href="cart.html" class="cart-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-count" id="cart-count">0</span>
        </a>
      </div>
    </div>
  </div>
</header>

<div id="product-detail"></div>

<section class="related">
  <div class="container">
    <h2>You May Also Like</h2>
    <div class="product-grid" id="related-products"></div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; 2026 Glamour Cosmetics. All rights reserved.</p>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
function renderStars(r){const f=Math.floor(r);const h=r%1>=0.5;let s="";for(let i=0;i<f;i++)s+="★";if(h)s+="½";for(let i=h?f+1:f;i<5;i++)s+="☆";return s;}

(function init(){
  const params = new URL(window.location.href).searchParams;
  const id = params.get("id");
  const products = loadProducts();
  const product = products.find(p => p.id === id);
  if (!product) {
    document.getElementById("product-detail").innerHTML = "<div class='container' style='padding:80px 0;text-align:center'><h2>Product not found</h2><a href='products.html'>Back to shop</a></div>";
    return;
  }
  document.title = product.name + " - Glamour Cosmetics";
  const discount = product.originalPrice ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;
  
  let colorsHTML = "";
  if (product.colors) {
    colorsHTML = `<div class="variant-section"><h4>Available Shades</h4><div class="color-options">${product.colors.map(c => `<span class="color-tag">${c}</span>`).join("")}</div></div>`;
  }
  
  document.getElementById("product-detail").innerHTML = `
    <section class="product-detail-section">
      <div class="container">
        <div class="product-detail-layout">
          <div class="product-detail-img">
            <span class="product-emoji-large">${product.image}</span>
            ${product.badge ? `<span class="product-badge large">${product.badge}</span>` : ""}
          </div>
          <div class="product-detail-info">
            <p class="breadcrumb"><a href="products.html">Shop</a> / <a href="products.html?cat=${product.category}">${product.category}</a> / ${product.name}</p>
            <h1>${product.name}</h1>
            <div class="product-stars">${renderStars(product.rating)} <span>${product.rating} (${product.reviews} reviews)</span></div>
            <div class="product-price large">
              <span class="current">$${product.price.toFixed(2)}</span>
              ${product.originalPrice ? `<span class="original">$${product.originalPrice.toFixed(2)}</span>` + (discount > 0 ? `<span class="save-badge">Save ${discount}%</span>` : "") : ""}
            </div>
            <p class="product-description">${product.description}</p>
            ${colorsHTML}
            <div class="qty-selector">
              <span>Quantity:</span>
              <button onclick="changeQty(-1)">−</button>
              <input type="number" id="qty-input" value="1" min="1" max="10" onchange="updateQty(this.value)">
              <button onclick="changeQty(1)">+</button>
            </div>
            <div class="product-actions">
              <button class="btn btn-primary btn-lg" onclick="addToCartWithQty()">Add to Cart - $${product.price.toFixed(2)}</button>
              <button class="btn btn-outline btn-lg" onclick="buyNow()">Buy Now</button>
            </div>
            <div class="product-meta">
              <p>${product.stock > 0 ? '<span class="in-stock">✓ In Stock</span>' : '<span class="out-stock">✕ Out of Stock</span>'} — Only ${product.stock} left</p>
            </div>
            <div class="accordion">
              <div class="accordion-item">
                <button class="accordion-btn active" onclick="toggleAccordion(this)">Ingredients</button>
                <div class="accordion-content open"><p>${product.ingredients}</p></div>
              </div>
              <div class="accordion-item">
                <button class="accordion-btn" onclick="toggleAccordion(this)">How to Use</button>
                <div class="accordion-content"><p>${product.howToUse}</p></div>
              </div>
              <div class="accordion-item">
                <button class="accordion-btn" onclick="toggleAccordion(this)">Shipping & Returns</button>
                <div class="accordion-content"><p>Free shipping on orders over $50. 30-day hassle-free returns. All products are cruelty-free and vegan.</p></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>`;
    
  const related = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
  document.getElementById("related-products").innerHTML = related.map(p => {
    const d = p.originalPrice ? Math.round((1 - p.price / p.originalPrice) * 100) : 0;
    return `
      <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
        <div class="product-img"><span class="product-emoji">${p.image}</span>${p.badge?`<span class="product-badge">${p.badge}</span>`:""}${d>0?`<span class="product-discount">-${d}%</span>`:""}</div>
        <div class="product-info">
          <span class="product-category">${p.category}</span>
          <h3>${p.name}</h3>
          <div class="product-stars">${renderStars(p.rating)}<span>(${p.reviews})</span></div>
          <div class="product-price"><span class="current">$${p.price.toFixed(2)}</span>${p.originalPrice?`<span class="original">$${p.originalPrice.toFixed(2)}</span>`:""}</div>
          <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();addToCart('${p.id}')">Add to Cart</button>
        </div>
      </div>`;
  }).join("");
})();

let currentQty = 1;
function changeQty(d) { currentQty = Math.max(1, Math.min(10, currentQty + d)); document.getElementById("qty-input").value = currentQty; }
function updateQty(v) { currentQty = Math.max(1, Math.min(10, parseInt(v) || 1)); document.getElementById("qty-input").value = currentQty; }
function addToCartWithQty() {
  const id = new URL(window.location.href).searchParams.get("id");
  addToCart(id, currentQty);
}

function buyNow() {
  const id = new URL(window.location.href).searchParams.get("id");
  addToCart(id, currentQty);
  location.href = "checkout.html";
}

function toggleAccordion(btn) {
  const content = btn.nextElementSibling;
  const isOpen = content.classList.contains("open");
  document.querySelectorAll(".accordion-content").forEach(c => c.classList.remove("open"));
  document.querySelectorAll(".accordion-btn").forEach(b => b.classList.remove("active"));
  if (!isOpen) { content.classList.add("open"); btn.classList.add("active"); }
}
</script>
</body>
</html>
